[build]
  publish = "public"
  functions = "netlify/functions"

# The entry screen lives at /update and uses the same page as the TV.
[[redirects]]
  from = "/update"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/update/*"
  to = "/index.html"
  status = 200

# Keep the update screen out of search engines.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"
